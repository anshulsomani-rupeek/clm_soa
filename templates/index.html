<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Federal Bank SOA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #004B87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #003366;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #004B87;
            box-shadow: 0 0 0 3px rgba(0, 75, 135, 0.1);
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        .form-group-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            background: #004B87;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #003366;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .error {
            display: none;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .error.show {
            display: block;
        }

        .loader {
            display: none;
            text-align: center;
            color: #004B87;
            font-size: 14px;
            margin-top: 10px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ddd;
            border-top: 2px solid #004B87;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SOA Generator</h1>
        <p class="subtitle">Federal Bank Statement of Account</p>

        <div class="error" id="errorMsg"></div>

        <form id="soaForm" onsubmit="handleSubmit(event)">
            <div class="form-group-row">
                <div class="form-group" style="flex: 1;">
                    <label for="lmsId">LMS ID / Account Number</label>
                    <input type="text" id="lmsId" name="lms_id" placeholder="Enter LMS ID" required autofocus />
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="bankSelect">Bank</label>
                    <select id="bankSelect" name="bank">
                        <option value="federal">Federal Bank</option>
                        <option value="sib">South Indian Bank (SIB)</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn">Generate SOA</button>

            <div class="loader" id="loader">
                <span class="spinner"></span> Generating...
            </div>
        </form>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            const lmsId = document.getElementById('lmsId').value.trim();
            const bank = document.getElementById('bankSelect').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');

            errorMsg.classList.remove('show');
            submitBtn.disabled = true;
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('lms_id', lmsId);
            formData.append('bank', bank);

            fetch('/generate', {
                method: 'POST',
                body: formData
            })
                .then(res => {
                    if (res.ok) {
                        // HTML response — replace page content
                        return res.text().then(html => {
                            document.documentElement.innerHTML = html;
                        });
                    } else if (res.headers.get('content-type').includes('application/json')) {
                        return res.json().then(data => {
                            throw new Error(data.error || 'Error generating SOA');
                        });
                    } else {
                        throw new Error('Error generating SOA');
                    }
                })
                .catch(err => {
                    submitBtn.disabled = false;
                    loader.style.display = 'none';
                    errorMsg.textContent = err.message;
                    errorMsg.classList.add('show');
                });
        }
    </script>
</body>

</html>
