<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SOA Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #004B87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #003366;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #004B87;
            box-shadow: 0 0 0 3px rgba(0, 75, 135, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #004B87;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #003366;
        }

        .error {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>SOA Generator</h1>
        <p class="subtitle">Please sign in to continue</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div style="text-align: center; margin-top: 20px;">
            <form action="/login" method="post" style="text-align: left;">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>

            <p style="margin-top: 25px; font-size: 11px; color: #888;">
                Authorized Rupeek employees only
            </p>

            <div style="margin-top: 30px; font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; text-align: center;">
                Step 2 of 2: Security Credentials
            </div>
        </div>

        <div class="footer">
            Rupeek Capital &copy; 2026
        </div>
    </div>
</body>

</html>
